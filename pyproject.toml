[project]
name = "thermal-research"
version = "0.1.0"
description = "Sim-to-real thermal-map prediction for a commercial processor (research code)"
requires-python = ">=3.11"
# torch is intentionally NOT listed: the DGX has a pinned torch 2.10.0+cu128 that pip must never touch.
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running tests (excluded from quick runs)",
  "data: needs the UCR public excerpt under data/raw (skipped if missing)",
  "gpu: needs CUDA",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]
